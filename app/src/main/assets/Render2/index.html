<!DOCTYPE html>
<html lang="en">
<head>
    <title>IPYNB VIEWER</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1">
    <script src="js/vendor/es5-shim.min.js"></script>
    <script src="js/vendor/marked.min.js"></script>
    <script src="js/vendor/purify.min.js"></script>
    <script src="js/vendor/ansi_up.min.js"></script>
    <script src="js/vendor/prism.min.js"></script>
    <script src="js/vendor/katex.min.js"></script>
    <script src="js/vendor/katex-auto-render.min.js"></script>
    <script src="js/vendor/notebook.min.js"></script>
    <link rel="stylesheet" href="css/vendor/katex.min.css" />
    <link rel="stylesheet" href="css/vendor/prism.css" />
    <link rel="stylesheet" href="css/notebook.css" />
    <link rel="stylesheet" href="css/nbpreview.css" />

    <style>
        div#notebook-holder {
            font-size: .5em;
            margin: 0 auto;
        }

        div#fileHead{
        		padding:5px 10px;
						background:#00ad2d;
						border:10px solid #00ad2d;
						position:relative;
						color:#fff;
						border-radius:10px;
						text-align:center;
						float:left;
						cursor:pointer

					}
				.file {
						z-index: 1000;
						opacity: 0;
						cursor: pointer;
						right: 0;
						top: 0;
						height: 100%;
						font-size: 24px;
						width: 100%;
						position: absolute;
					}

					div#header {
						font-size: 2em;
						color:#1877f2;
						background:#ffffff;
        }

        .center-screen {
					display: flex;
					flex-direction: column;
					justify-content: center;
					align-items: center;
					text-align: left;
					min-height: 100vh;
						}

        </style>

</head>
<body>
<div id="main" style="background-color:#ffffff" class="center-screen">
    <div id="controls" style="background-color:#ffffff">
            <div id="header">IPYNB VIEWER</div>
            <div id="fileHead" style=>
                Choose File
                <input type="file" id="file" class="file">
            </div>
    </div>
    <div id="notebook-holder"></div>
    <div id="error"style="padding-top:100px"></div>
</div>

<script src="js/nbpreview.js"></script>


</body>

</html>
