<!DOCTYPE html>
<html>
<head>
    <title>Ipynb Viewer</title>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/prism/1.5.1/themes/prism.min.css'/>
    <script src='lib/marked.min.js'></script>
    <script src='lib/prism.min.js' data-manual></script>
    <script src='lib/prism-python.min.js' data-manual></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.11.1/dist/katex.min.css" integrity="sha384-zB1R0rpPzHqg7Kpt0Aljp8JPLqbXI3bhnPWROx27a9N0Ll6ZP/+DiW/UqRcLbRjq" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.11.1/dist/katex.min.js" integrity="sha384-y23I5Q6l+B6vatafAwxRu/0oK/79VlbSz7Q9aiSZUvyWYIYsd+qj+o24G5ZU2zJz" crossorigin="anonymous"></script>
    <script src='lib/nbv.js'></script>
    <style type='text/css'>
        body {
            font: .9em Arial, sans-serif;
        }

				div#instructions {
            max-width: 960px;
            font-size: 2em;
            color: rgb(108, 108, 108);
            text-align: center;
            margin: 0 auto;
        }
        div#instructions small {
            font-size: 1em;
        }

        div#header {
						font-size: 5em;
						color:#1877f2;
        }

        .center-screen {
					display: flex;
					flex-direction: column;
					justify-content: center;
					align-items: center;
					text-align: left;
					min-height: 100vh;
						}



				div#fileHead{
						font-size: 5em;
						padding:5px 10px;
						background:#00ad2d;
						border:10px solid #00ad2d;
						position:relative;
						color:#fff;
						border-radius:10px;
						text-align:center;
						float:left;
						cursor:pointer
					}
				.fileUpload {
						position: absolute;
						z-index: 1000;
						opacity: 0;
						cursor: pointer;
						right: 0;
						top: 0;
						height: 100%;
						font-size: 24px;
						width: 100%;
					}
    </style>
</head>

<body>

<div id="titlediv" class="center-screen">
    <div id="header" style="padding-bottom: 100px"><b>IPYNB VIEWER</b></div>
    <div id="fileHead">
        Choose File
        <input type = file id = "fileUpload" class="fileUpload">
    </div>

    <div style ="padding-top: 100px">
        <center>
            <span id="error"></span>
        </center>
    </div>
</div>

<div id="file-upload-filename"></div>



<script>
		var fileHead = document.getElementById("fileHead");
		var titleValue = document.getElementById("titlediv");
    var input = document.getElementById( 'fileUpload' );
    var error = document.getElementById("error");
    error.style.PaddingTop = "200px";
    var header = document.getElementById( 'header' );

    var infoArea = document.getElementById( 'file-upload-filename' );

    if (!window.marked || !window.Prism || !window.katex) {
			error.textContent = 'Please allow internet to download Katex CSS/JS files and reload the page';
      error.align = "center";
      error.style.fontSize = "3.5em";
      error.style.color = "red";
    }
    const nbv = nbv_constructor(document, {
        katex: window.katex,
        prism: window.Prism,
        marked: window.marked,
    })

    input.addEventListener( 'change', showFileName );
    function showFileName( event ) {
    var input = event.srcElement;
    if(input.files[0] != null){
    var fileName = input.files[0].name;
    var fn = input.files[0]
    if (fileName.endsWith('.ipynb')) {
      var rd = new FileReader()

      rd.addEventListener('load', displayfunc);
      function displayfunc(){
      var dt = JSON.parse(rd.result)
      //infoArea.textContent = JSON.stringify(dt)
      var tg = document.createElement('div')
      tg.setAttribute('class', 'rendered-notebook')
      tg.setAttribute('rel', fn.name)
      infoArea.appendChild(tg)
      nbv.render(dt, tg)
    }
       rd.readAsText(fn)
       input.hidden = true
       titleValue.style.display = "none"
       fileHead.hidden = true
       error.textContent =""
       header.hidden=true
    }
      else{
      error.textContent = 'Please upload correct ipynb format file';
      error.align = "center";
      error.style.fontSize = "3.5em";
      error.style.color = "red";
      }
  }
  }

</script>

</body>
</html>
